# Labs 7-9: Simple end-to-end MLOps pipeline

data:
  raw_path: data/raw/airline.csv
  processed_dir: data/processed
  target_column: satisfaction
  id_column: id

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 150
  max_depth: 12
  random_state: 42
  class_weight: balanced

mlflow:
  tracking_uri: ""
  experiment_name: airline_satisfaction_model_training_lab7

registry:
  model_name: Airline_Satisfaction_Production_Model
  decision_metric: recall

quality_gate:
  metric: recall
  minimum_value: 0.70

lab9:
  repetitions: 3

paths:
  preprocessor: models/preprocessor.pkl
  model: models/satisfaction_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  inference_output: outputs/inference_predictions.csv
